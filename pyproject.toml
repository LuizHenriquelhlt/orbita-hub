[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orbita-hub"
version = "0.1.0"
description = "Plataforma de orquestração de automações corporativas, catálogo, execução, fila e runners plugáveis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Dependências do núcleo: valem para os quatro serviços e para o gateway.
# Tudo que é específico de um adaptador (RabbitMQ, Redis, S3, Docker) é extra,
# porque o free tier roda sem nenhum deles, ver docs/adr/0002.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
rabbitmq = ["aio-pika>=9.5"]
redis = ["redis>=5.2"]
s3 = ["boto3>=1.35"]
docker = ["docker>=7.1"]
portal = ["django>=5.1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]
# Tudo, para desenvolvimento local com o compose completo.
all = [
    "orbita-hub[rabbitmq,redis,s3,docker,portal,dev]",
]

[project.scripts]
orbita = "hub_core.cli:main"

[tool.setuptools.packages.find]
# Cada serviço é uma raiz de pacote própria: a fronteira entre domínios é
# visível na árvore de diretórios, não só na documentação.
where = [
    "packages/hub-core",
    "services/identity",
    "services/catalog",
    "services/execution",
    "services/runner",
    "gateway",
    "sdk",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = [
    "RUF001",  # caracteres ambíguos: o projeto é em português, acentos são normais
    "RUF002",
    "RUF003",
    "B008",    # Depends() no default é o idioma do FastAPI
    # N818 exige que toda exceção termine em "Error". A convenção existe para
    # que o nome diga que a classe é uma exceção, propósito que `ErroOrbita`,
    # `SenhaMuitoLonga` e `ExpressaoCronInvalida` cumprem em português. Trocar
    # por `OrbitaError` misturaria dois idiomas no mesmo identificador.
    "N818",
]

[tool.ruff.lint.isort]
# Sem isto, o ruff trata `hub_core` e companhia como dependências de terceiro
# (elas estão mesmo instaladas no ambiente virtual, em modo editável) e as
# ordena junto com `fastapi` e `sqlalchemy`. Declarar os pacotes do monorepo
# como primeira parte mantém os blocos de import legíveis.
known-first-party = [
    "hub_core",
    "hub_identity",
    "hub_catalog",
    "hub_execution",
    "hub_runner",
    "hub_gateway",
    "hub_sdk",
    # Apps do portal Django. Nao sao pacotes instalados, vivem em
    # apps/portal e entram no sys.path pelo manage.py/asgi.
    "nucleo",
    "contas",
    "marketplace",
    "execucoes",
    "painel",
    "administracao",
    "portal",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"**/migrations/*" = ["E501", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integracao: exige PostgreSQL de verdade (ver docker-compose ou CI)",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
