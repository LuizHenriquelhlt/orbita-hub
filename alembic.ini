# Configuração do Alembic.
#
# Um único ambiente de migração para os cinco schemas (`identity`, `catalog`,
# `execution`, `runner`, `plataforma`). Eles vivem no mesmo banco, então uma
# linha de versão e uma transação por migração — o que garante que o estado do
# banco é sempre coerente entre serviços.
#
# A alternativa, um ambiente por serviço, só se paga quando cada serviço tem o
# seu **próprio banco**; aí as migrações passam a ser de fato independentes.
# Enquanto o banco é um, cinco linhas de versão produziriam combinações de
# estado que ninguém testou. Ver docs/adr/0003.
#
# A URL não está aqui: vem de DATABASE_URL, lida em migrations/env.py.
# Credencial em arquivo versionado é como credencial vaza.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Nome dos arquivos de migração: ordem numérica explícita em vez do hash
# aleatório padrão. Com `0003_fila_em_postgres.py` a ordem é legível no `ls`;
# com `a1b2c3d4e5f6_.py`, não.
file_template = %%(rev)s_%%(slug)s

# Formata a migração recém-gerada. `type = module` executa
# `python -m ruff` com o interpretador atual, em vez de procurar um binário
# `ruff` no PATH do sistema — que não existe quando o ruff está instalado
# apenas no ambiente virtual do projeto, que é o caso normal.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
